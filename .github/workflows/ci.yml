name: Codecov check
on: [push, pull_request]
jobs:
  run:
    # ubuntu-latest (26.04) has no Python 3.9 build
    runs-on: ubuntu-24.04

    # 3.9 resolves to pandas 2, 3.13 to pandas 3.
    # The pinned job tests the lower bounds in requirements.txt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
          - python-version: '3.9'
            pins: numpy==1.23.5 pandas==2.2.2 scipy==1.11.0 statsmodels==0.14.5 plotly==6.0.0 matplotlib==3.9.0 openpyxl==3.1.0
          - python-version: '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]" ${{ matrix.pins }}
      - name: Run tests and collect coverage
        run: pytest --cov .
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4-beta
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
